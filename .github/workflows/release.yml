name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- macOS 编译 ---
  macos:
    runs-on: macos-latest
    name: macos (${{ matrix.platform.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: "aarch64-apple-darwin"
          - target: "x86_64-apple-darwin"
    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Strip & UPX
        continue-on-error: true
        run: |
          strip target/${{ matrix.platform.target }}/release/stat_server
          strip target/${{ matrix.platform.target }}/release/stat_client
        shell: bash

      - name: Package Release
        run: |
          python3 scripts/package_release.py --target ${{ matrix.platform.target }} --bin-dir target/${{ matrix.platform.target }}/release
        shell: bash

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
          draft: false

  # --- Linux, Android, Windows 编译 ---
  cross-build:
    name: Build for ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ""
            use-cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            suffix: ""
            use-cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            use-cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        run: |
          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            choco install protoc --no-progress
          else
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Cross
        if: matrix.platform.use-cross
        uses: taiki-e/install-action@cross

      - name: Build release
        run: |
          if [ "${{ matrix.platform.use-cross }}" = "true" ]; then
            cross build --release --target=${{ matrix.platform.target }}
          else
            cargo build --release --target=${{ matrix.platform.target }}
          fi
        shell: bash

      - name: Strip & UPX
        continue-on-error: true
        uses: svenstaro/upx-action@v2
        with:
          files: |
            target/${{ matrix.platform.target }}/release/stat_server${{matrix.platform.suffix}}
            target/${{ matrix.platform.target }}/release/stat_client${{matrix.platform.suffix}}
          args: --best --lzma

      - name: Package Release
        run: |
          python3 scripts/package_release.py --target ${{ matrix.platform.target }} --bin-dir target/${{ matrix.platform.target }}/release --suffix "${{ matrix.platform.suffix }}" || python scripts/package_release.py --target ${{ matrix.platform.target }} --bin-dir target/${{ matrix.platform.target }}/release --suffix "${{ matrix.platform.suffix }}"
        shell: bash

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
          draft: false
